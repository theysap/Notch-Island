name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    # Signing and notarisation happen only if these are set. With none of them
    # the image is still built and published, ad-hoc signed — which Gatekeeper
    # refuses on first launch. See the Distribution section of TECHNICAL.md.
    #
    # They live at job level so the steps below can test them: the `secrets`
    # context cannot be read from a step's `if`, but `env` can.
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
      NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
      NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          # build-app.sh derives the bundle's build number from the commit
          # count, which needs the full history.
          fetch-depth: 0

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          if [ "${TAG}" != "${FILE}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${FILE})" >&2
            exit 1
          fi

      - name: Test
        run: ./Scripts/test.sh

      # codesign can only use an identity that is actually in a keychain, and a
      # fresh runner has none. The certificate is carried as a base64 .p12
      # secret and imported into a throwaway keychain for the length of the
      # job.
      - name: Import signing certificate
        if: env.DEVELOPER_ID_CERTIFICATE_P12 != ''
        run: |
          KEYCHAIN="${RUNNER_TEMP}/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          CERT="${RUNNER_TEMP}/certificate.p12"

          echo "${DEVELOPER_ID_CERTIFICATE_P12}" | base64 --decode > "${CERT}"

          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"
          security set-keychain-settings -lut 21600 "${KEYCHAIN}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}"

          security import "${CERT}" -k "${KEYCHAIN}" \
            -P "${DEVELOPER_ID_CERTIFICATE_PASSWORD}" \
            -T /usr/bin/codesign -T /usr/bin/security
          # Without this, codesign stops to ask for permission and the job
          # hangs until it times out.
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN}" > /dev/null

          security list-keychain -d user -s "${KEYCHAIN}" login.keychain-db
          rm -f "${CERT}"

          security find-identity -v -p codesigning "${KEYCHAIN}"

      - name: Build application
        run: ./Scripts/build-app.sh

      - name: Package disk image
        run: ./Scripts/make-dmg.sh

      - name: Remove the signing keychain
        if: always() && env.DEVELOPER_ID_CERTIFICATE_P12 != ''
        run: security delete-keychain "${RUNNER_TEMP}/signing.keychain-db" || true

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.dmg dist/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed in this release."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland-dmg
          path: dist/*.dmg
          if-no-files-found: error

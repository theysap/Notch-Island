name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
        with:
          # build-app.sh derives the bundle's build number from the commit
          # count, which needs the full history.
          fetch-depth: 0

      - name: Check the tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE="$(cat VERSION)"
          if [ "${TAG}" != "${FILE}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match VERSION (${FILE})" >&2
            exit 1
          fi

      - name: Test
        run: ./Scripts/test.sh

      - name: Build application
        run: ./Scripts/build-app.sh

      - name: Package disk image
        # Signing and notarisation happen only if the secrets exist. Without
        # them the image is still built and published, just ad-hoc signed —
        # which Gatekeeper refuses on first launch. See TECHNICAL.md.
        env:
          DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
        run: ./Scripts/make-dmg.sh

      - name: Checksums
        run: |
          cd dist
          shasum -a 256 *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            dist/*.dmg dist/SHA256SUMS.txt \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](CHANGELOG.md) for what changed in this release."

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NotchIsland-dmg
          path: dist/*.dmg
          if-no-files-found: error
